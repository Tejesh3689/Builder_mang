name: Database Migrate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to migrate (staging or production)'
        required: true
        default: 'staging'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Run Prisma Migrations
        run: pnpm --filter web prisma migrate deploy
        env:
          DATABASE_URL: ${{ github.event.inputs.environment == 'production' && secrets.PROD_DATABASE_URL || secrets.STAGING_DATABASE_URL }}
